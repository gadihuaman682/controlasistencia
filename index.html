function fIng(i){return i<DIA?fFecha(i)+" "+fHora(i):fHora(i)}
function vistaHoy(aviso){barraUsuario();var D=datosHoy(),P=D.P;HOYD=D;var ahora=Date.now(),esHoy=ahora>=DIA&&ahora<DIA+DAY,tit=DIAS[L(DIA).getUTCDay()]+" "+fFecha(DIA)+(esHoy?" (hoy)":"");
var h=tabs()+'<div class="card bar"><div class="sem"><button class="btn" id="da">‹ Día anterior</button><div class="rango">'+tit+'</div><button class="btn" id="ds">Día siguiente ›</button><button class="btn" id="dh">Hoy</button></div><div><button class="btn" id="ac">Actualizar</button> <button class="btn p" id="ex">Descargar Excel</button></div></div>';
if(aviso)h+='<div class="card" style="border-color:#c77a00">'+esc(aviso)+'</div>';
h+='<div class="kpis"><div class="kpi"><b>'+D.hicieron+" / "+D.act+'</b><span>Hicieron clock in</span></div><div class="kpi"><b>'+D.ab.length+'</b><span>Sin clock out (salida pendiente)</span></div><div class="kpi"><b>'+D.sin.length+'</b><span>Sin clock in</span></div><div class="kpi"><b>'+D.ce.length+'</b><span>Con salida marcada</span></div>'+kpiEpp(D)+'</div>';
h+='<div class="card"><h2>Sin clock out (siguen con el ingreso abierto)</h2>';
if(!D.ab.length)h+='<div class="vacio">Ninguno.</div>';else{h+='<div class="tw"><table><thead><tr><th>Técnico</th><th>Tipo</th><th>Lugar</th><th>Trabajo</th><th>Ingreso</th><th class="n">Tiempo</th><th>Estado</th><th>Ubicación</th><th>EPP</th></tr></thead><tbody>';
D.ab.forEach(function(s){var a=s.a,p=P[a.user_id]||{};h+="<tr><td><b>"+esc(nomT(P,a.user_id))+'</b><span class="sub">'+esc(p.empresa||"")+"</span></td><td>"+tipoTxt(a)+"</td><td>"+esc(lugarTxt(a))+"</td><td>"+esc(a.trabajo||"")+"</td><td>"+fIng(s.i)+'</td><td class="n"><b>'+fDur(s.dur)+"</b></td><td>"+estChip(s.dur)+"</td><td>"+mapa(a.ingreso_lat,a.ingreso_lon)+"</td><td>"+eppCelda(a)+"</td></tr>"});h+="</tbody></table></div>"}
h+='</div><div class="card"><h2>Con clock out del día</h2>';
if(!D.ce.length)h+='<div class="vacio">Ninguno.</div>';else{h+='<div class="tw"><table><thead><tr><th>Técnico</th><th>Tipo</th><th>Lugar</th><th>Trabajo</th><th>Ingreso</th><th>Salida</th><th class="n">Duración</th><th>Ubicación</th><th>EPP</th></tr></thead><tbody>';
D.ce.forEach(function(s){var a=s.a;h+="<tr><td><b>"+esc(nomT(P,a.user_id))+"</b></td><td>"+tipoTxt(a)+"</td><td>"+esc(lugarTxt(a))+"</td><td>"+esc(a.trabajo||"")+"</td><td>"+fIng(s.i)+"</td><td>"+fHora(s.o)+'</td><td class="n">'+fDur(s.dur)+"</td><td>Ingreso: "+mapa(a.ingreso_lat,a.ingreso_lon)+" · Salida: "+mapa(a.salida_lat,a.salida_lon)+"</td><td>"+eppCelda(a)+"</td></tr>"});h+="</tbody></table></div>"}
h+='</div><div class="card"><h2>Sin clock in este día</h2>';
if(!D.sin.length)h+='<div class="vacio">Todos los técnicos activos marcaron ingreso.</div>';else{h+='<div class="tw"><table><thead><tr><th>Técnico</th><th>Empresa</th></tr></thead><tbody>';D.sin.forEach(function(p){h+="<tr><td><b>"+esc(p.nombre||String(p.id).slice(0,8))+"</b></td><td>"+esc(p.empresa||"")+"</td></tr>"});h+="</tbody></table></div>"}
h+='<div class="pie">Horas de Lima (UTC-5). "Sin clock out" incluye ingresos abiertos de días anteriores. Se excluyen cuentas bloqueadas o con contrato vencido. Esta pantalla se actualiza sola cada 2 minutos.</div></div>';
$("v").innerHTML=h;ligarTabs();
$("da").onclick=function(){DIA-=DAY;cargar()};$("ds").onclick=function(){DIA+=DAY;cargar()};$("dh").onclick=function(){DIA=inicioDia(Date.now());cargar()};$("ac").onclick=cargar;$("ex").onclick=exportarHoy}

/* ---- Resumen semanal ---- */

/* ---- Informes subidos por los técnicos ---- */
var INF=[],INFQ="";
function cargarInformes(){api("/rest/v1/informes?select=*&order=actualizado_en.desc&limit=500").then(function(r){if(!r.ok){vistaInformes("No se pudo leer la tabla de informes ("+r.st+"). ¿Ya ejecutaste el SQL de informes en Supabase?");return}INF=r.d;vistaInformes("")})}
function descargarInforme(ruta,nombre){api("/storage/v1/object/sign/informes/"+ruta.split("/").map(encodeURIComponent).join("/"),{m:"POST",b:{expiresIn:120}}).then(function(r){if(!r.ok||!r.d.signedURL){alert("No se pudo generar el enlace ("+r.st+").");return}var a=document.createElement("a");a.href=CFG.url+"/storage/v1"+r.d.signedURL+"&download="+encodeURIComponent(nombre||"informe.xlsx");document.body.appendChild(a);a.click();a.remove()})}
function vistaInformes(aviso){barraUsuario();var q=INFQ.trim().toLowerCase(),f=INF.filter(function(x){return !q||((x.tecnico||"")+" "+(x.estacion||"")+" "+(x.archivo||"")).toLowerCase().indexOf(q)>-1});
var h=tabs()+'<div class="card"><h2>Informes subidos</h2>'+(aviso?'<p class="s">'+esc(aviso)+'</p>':'')+'<input id="iq" type="text" placeholder="Buscar por técnico, estación o archivo" value="'+esc(INFQ)+'" style="width:100%;box-sizing:border-box;margin-bottom:10px">';
if(!f.length)h+='<div class="vacio">No hay informes.</div>';else{h+='<div class="tw"><table><thead><tr><th>Fecha</th><th>Técnico</th><th>Estación</th><th>Archivo</th><th class="n">KB</th><th></th></tr></thead><tbody>';
f.forEach(function(x,i){var t=Date.parse(x.actualizado_en||x.creado_en);h+='<tr><td>'+fFecha(t)+' '+fHora(t)+'</td><td><b>'+esc(x.tecnico||"")+'</b></td><td>'+esc(x.estacion||"")+'</td><td>'+esc(x.archivo||"")+'</td><td class="n">'+(x.tamano_kb||"")+'</td><td><button class="btn" data-i="'+i+'">Descargar</button></td></tr>'});h+='</tbody></table></div>'}
h+='<div class="pie">Se muestran los últimos 500 informes. Si un técnico vuelve a generar la misma estación, el archivo se reemplaza y la fecha se actualiza.</div></div>';
$("v").innerHTML=h;ligarTabs();
var bi=$("iq");bi.oninput=function(){INFQ=this.value;vistaInformes(aviso);var n=$("iq");n.focus();n.setSelectionRange(n.value.length,n.value.length)};
Array.prototype.forEach.call(document.querySelectorAll("[data-i]"),function(b){b.onclick=function(){var x=f[+b.getAttribute("data-i")];descargarInforme(x.ruta,x.archivo)}})}
function vistaPanel(aviso){barraUsuario();
var r=rango(),fin=r[1]-DAY,U=resumir(FILAS,PERF,Date.now()),tot=0,ses=0,curso=0;
var TT={estacion:0,almacen:0,otro:0};U.forEach(function(u){tot+=u.ms;ses+=u.ses.length;if(u.obs.curso)curso++;for(var k in TT)TT[k]+=u.tipo[k]||0});
var h=tabs()+'<div class="card bar"><div class="sem"><button class="btn" id="sa">‹ Anterior</button><div class="rango">'+fFecha(r[0])+" – "+fFecha(fin)+'</div><button class="btn" id="ss">Siguiente ›</button><button class="btn" id="sh">Esta semana</button></div><div><button class="btn" id="ac">Actualizar</button> <button class="btn p" id="ex">Descargar Excel</button></div></div>';
if(aviso)h+='<div class="card" style="border-color:#c77a00">'+esc(aviso)+'</div>';
h+='<div class="kpis"><div class="kpi"><b>'+fDur(tot)+'</b><span>Horas trabajadas (semana)</span></div><div class="kpi"><b>'+U.filter(function(u){return u.ms>0}).length+'</b><span>Técnicos con horas</span></div><div class="kpi"><b>'+ses+'</b><span>Sesiones (ingreso/salida)</span></div><div class="kpi"><b>'+curso+'</b><span>En obra ahora</span></div><div class="kpi"><b style="font-size:15px;line-height:1.5">Estaciones '+fDur(TT.estacion)+'<br>Almacén '+fDur(TT.almacen)+'<br>Otros '+fDur(TT.otro)+'</b><span>Por tipo de lugar</span></div></div>';
h+='<div class="card"><h2>Horas por técnico</h2><div class="tw"><table><thead><tr><th>Técnico</th><th>Empresa</th><th class="n">Días</th><th class="n">Horas</th><th class="n">Estaciones</th><th class="n">Almacén</th><th class="n">Otros</th><th class="n">Marcas</th><th>Observaciones</th></tr></thead><tbody>';
if(!U.length)h+='<tr><td colspan="9">No hay técnicos ni marcas en esta semana.</td></tr>';
U.forEach(function(u,ix){h+='<tr class="u" data-u="'+ix+'"><td><b>'+esc(u.p.nombre||u.id.slice(0,8))+'</b></td><td>'+esc(u.p.empresa||"")+'</td><td class="n">'+u.nd+'</td><td class="n"><b>'+fDur(u.ms)+'</b></td><td class="n">'+fDur(u.tipo.estacion)+'</td><td class="n">'+fDur(u.tipo.almacen)+'</td><td class="n">'+fDur(u.tipo.otro)+'</td><td class="n">'+u.ses.length+'</td><td>'+obsChips(u.obs)+'</td></tr>';
if(ABIERTOS[u.id]&&u.ses.length){h+='<tr class="det"><td colspan="9"><b>Por día</b><table><thead><tr><th>Día</th><th class="n">Horas</th><th>Lugares</th></tr></thead><tbody>';
Object.keys(u.dd).sort(function(x,y){return u.dd[x].t-u.dd[y].t}).forEach(function(k){var d=u.dd[k];h+="<tr><td>"+DIAS[L(d.t).getUTCDay()]+" "+fFecha(d.t)+'</td><td class="n">'+fDur(d.ms)+"</td><td>"+esc(Object.keys(d.l).join(" · "))+"</td></tr>"});
h+='</tbody></table><b>Detalle de marcas</b><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Lugar</th><th>Trabajo</th><th>Ingreso</th><th>Salida</th><th class="n">Duración</th><th>Ubicación</th><th>EPP</th></tr></thead><tbody>';
u.ses.forEach(function(s){var a=s.a;h+="<tr><td>"+fFecha(s.i)+"</td><td>"+tipoTxt(a)+"</td><td>"+esc(lugarTxt(a))+"</td><td>"+esc(a.trabajo||"")+"</td><td>"+fHora(s.i)+"</td><td>"+(s.o?fHora(s.o):s.est==="curso"?"en curso":"sin salida")+'</td><td class="n">'+(s.est==="sinsalida"?"—":fDur(s.ms))+"</td><td>Ingreso: "+mapa(a.ingreso_lat,a.ingreso_lon)+" · Salida: "+mapa(a.salida_lat,a.salida_lon)+"</td><td>"+eppCelda(a)+"</td></tr>"});
h+="</tbody></table></td></tr>"}});
h+='</tbody></table></div><div class="pie">Haz clic en un técnico para ver el detalle por día y cada marca. Las marcas sin salida (más de 16 h) no suman horas. Horas de Lima (UTC-5); las marcas usan el reloj del celular de cada técnico.</div></div>';
$("v").innerHTML=h;ligarTabs();
$("sa").onclick=function(){SEM-=7*DAY;cargar()};$("ss").onclick=function(){SEM+=7*DAY;cargar()};$("sh").onclick=function(){SEM=lunes(Date.now());cargar()};$("ac").onclick=cargar;$("ex").onclick=function(){exportar(U)};
[].forEach.call(document.querySelectorAll("tr.u"),function(tr){tr.onclick=function(){var u=U[+tr.getAttribute("data-u")];ABIERTOS[u.id]=!ABIERTOS[u.id];vistaPanel(aviso)}})}

/* ---- Excel ---- */
function estilo(ws,fila){var hr=ws.getRow(fila);hr.font={bold:true,color:{argb:"FFFFFFFF"}};hr.eachCell(function(cc){cc.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFD71920"}}});for(var i=1;i<=ws.columnCount;i++)ws.getColumn(i).width=18}
function bajar(wb,nombre){wb.xlsx.writeBuffer().then(function(buf){var l=document.createElement("a");l.href=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));l.download=nombre;document.body.appendChild(l);l.click();l.remove()})}
function sufijo(t){var d=L(t);return d.getUTCFullYear()+z(d.getUTCMonth()+1)+z(d.getUTCDate())}
function exportarHoy(){if(typeof ExcelJS==="undefined"){alert("No se cargó el generador de Excel. Revisa tu conexión a internet.");return}if(!HOYD)return;
var D=HOYD,P=D.P,wb=new ExcelJS.Workbook(),a=wb.addWorksheet("Sin clock out"),b=wb.addWorksheet("Con clock out"),c=wb.addWorksheet("Sin clock in");
a.addRow(["Técnico","Empresa","Tipo","Lugar","Trabajo","Ingreso","Horas transcurridas","Estado","Lat ingreso","Lon ingreso","Foto EPP"]);
b.addRow(["Técnico","Tipo","Lugar","Trabajo","Ingreso","Salida","Horas","Lat ingreso","Lon ingreso","Lat salida","Lon salida","Foto EPP"]);
c.addRow(["Técnico","Empresa"]);
var H=function(ms){return Math.round(ms/36000)/100};
D.ab.forEach(function(s){var x=s.a,p=P[x.user_id]||{};a.addRow([nomT(P,x.user_id),p.empresa||"",tipoTxt(x),lugarTxt(x),x.trabajo||"",fFecha(s.i)+" "+fHora(s.i),H(s.dur),s.dur>=LIM_OLVIDO?"Sin salida (más de 16 h)":s.dur>=LIM_AVISO?"Más de 10 h":"En obra",x.ingreso_lat,x.ingreso_lon,eppEstTxt(x)])});
D.ce.forEach(function(s){var x=s.a;b.addRow([nomT(P,x.user_id),tipoTxt(x),lugarTxt(x),x.trabajo||"",fFecha(s.i)+" "+fHora(s.i),fFecha(s.o)+" "+fHora(s.o),H(s.dur),x.ingreso_lat,x.ingreso_lon,x.salida_lat,x.salida_lon,eppEstTxt(x)])});
D.sin.forEach(function(p){c.addRow([p.nombre||p.id,p.empresa||""])});
[[a,1],[b,1],[c,1]].forEach(function(x){estilo(x[0],x[1])});bajar(wb,"Asistencia_dia_"+sufijo(DIA)+".xlsx")}
function exportar(U){if(typeof ExcelJS==="undefined"){alert("No se cargó el generador de Excel. Revisa tu conexión a internet.");return}
var wb=new ExcelJS.Workbook(),a=wb.addWorksheet("Resumen"),b=wb.addWorksheet("Detalle"),c=wb.addWorksheet("Por día"),r=rango(),fin=r[1]-DAY;
var H=function(ms){return Math.round(ms/36000)/100},HM=function(ms){return Math.floor(ms/3600000)+":"+z(Math.round(ms/60000)%60)};
a.addRow(["Semana",fFecha(r[0])+" – "+fFecha(fin)]);a.addRow([]);a.addRow(["Técnico","Empresa","Días trabajados","Horas","Horas (hh:mm)","Estaciones (h)","Almacén (h)","Otros (h)","Marcas","Observaciones"]);
b.addRow(["Técnico","Fecha","Tipo de lugar","Propiedad","Código","Lugar","Trabajo","Ingreso","Salida","Horas","Estado","Lat ingreso","Lon ingreso","Lat salida","Lon salida","Foto EPP"]);
c.addRow(["Técnico","Día","Horas","Lugares"]);
var T={ok:"OK",curso:"En curso",sinsalida:"Sin salida"};
U.forEach(function(u){var ob=[],nom=u.p.nombre||u.id;if(u.obs.curso)ob.push("En obra ahora");if(u.obs.sinsalida)ob.push("Sin salida marcada");if(u.obs.singps)ob.push("Marca sin GPS");if(u.obs.sinmarcas)ob.push("Sin marcas");
a.addRow([nom,u.p.empresa||"",u.nd,H(u.ms),HM(u.ms),H(u.tipo.estacion),H(u.tipo.almacen),H(u.tipo.otro),u.ses.length,ob.join(", ")]);
Object.keys(u.dd).sort(function(x,y){return u.dd[x].t-u.dd[y].t}).forEach(function(k){var d=u.dd[k];c.addRow([nom,DIAS[L(d.t).getUTCDay()]+" "+fFecha(d.t),H(d.ms),Object.keys(d.l).join(" · ")])});
u.ses.forEach(function(s){var x=s.a;b.addRow([nom,fFecha(s.i),tipoTxt(x),x.tipo_lugar==="almacen"?propTxt(x):"",x.codigo||"",x.site||"",x.trabajo||"",fFecha(s.i)+" "+fHora(s.i),s.o?fFecha(s.o)+" "+fHora(s.o):"",s.est==="sinsalida"?null:H(s.ms),T[s.est],x.ingreso_lat,x.ingreso_lon,x.salida_lat,x.salida_lon,eppEstTxt(x)])})});
[[a,3],[b,1],[c,1]].forEach(function(x){estilo(x[0],x[1])});bajar(wb,"Asistencia_semana_"+sufijo(r[0])+".xlsx")}

setInterval(function(){if(TOKEN&&VISTA==="hoy"&&DIA===inicioDia(Date.now()))cargarHoy()},120000);
if(!CFG)vistaConfig();else vistaLogin();
</script>
